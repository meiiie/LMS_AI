<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Wiii — a durable AI workbench</title>
  <desc id="desc">The approved Neko Peek identity and Wiii platform positioning for social sharing.</desc>
  <defs>
