<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Wiii product platform overview</title>
  <desc id="desc">A polished hero banner showing Wiii as a living AI runtime with memory, retrieval, Pointy host actions, CI/CD, and production delivery.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fbff"/>
      <stop offset="0.48" stop-color="#edf7f3"/>
      <stop offset="1" stop-color="#fff4e6"/>
    </linearGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b4f8a"/>
      <stop offset="0.5" stop-color="#0f8f9c"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff9de" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ffad5a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#16324f" flood-opacity="0.18"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#0b4f8a" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="560" rx="42" fill="url(#sky)"/>
  <rect width="1400" height="560" rx="42" fill="url(#grid)" opacity="0.72"/>
  <circle cx="1130" cy="116" r="190" fill="url(#glow)"/>
  <path d="M0 435C160 393 287 427 434 399C590 370 724 285 881 318C1012 346 1084 427 1211 406C1288 393 1348 354 1400 327V560H0Z" fill="#0f8f9c" opacity="0.13"/>
  <path d="M0 476C176 442 309 476 462 448C630 418 779 353 936 381C1075 406 1186 494 1400 410V560H0Z" fill="#0b4f8a" opacity="0.10"/>

  <g transform="translate(104 84)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" fill="#09243f">Wiii</text>
    <text x="0" y="58" font-family="Verdana, sans-serif" font-size="25" fill="#34516a">Living AI runtime for learning, memory, tools, and LMS collaboration.</text>
    <text x="0" y="98" font-family="Verdana, sans-serif" font-size="18" fill="#60758a">FastAPI + WiiiRunner + PostgreSQL/pgvector + Tauri + iframe/embed + Pointy host actions</text>
  </g>

  <g transform="translate(110 218)" filter="url(#softShadow)">
    <rect width="352" height="178" rx="28" fill="#ffffff" opacity="0.88"/>
    <circle cx="62" cy="66" r="34" fill="#ff7417"/>
    <text x="47" y="78" font-family="Verdana, sans-serif" font-size="30" font-weight="700" fill="#ffffff">W</text>
    <text x="116" y="58" font-family="Verdana, sans-serif" font-size="23" font-weight="700" fill="#12263a">Living Memory</text>
    <text x="116" y="91" font-family="Verdana, sans-serif" font-size="16" fill="#5d7184">Persona, relationship, facts,</text>
    <text x="116" y="116" font-family="Verdana, sans-serif" font-size="16" fill="#5d7184">goals, craft, and continuity.</text>
  </g>

  <g transform="translate(522 218)" filter="url(#softShadow)">
    <rect width="352" height="178" rx="28" fill="#ffffff" opacity="0.9"/>
    <path d="M56 92C56 57 81 34 113 34C145 34 170 57 170 92C170 127 145 150 113 150C81 150 56 127 56 92Z" fill="#e7f7f1" stroke="#0f8f9c" stroke-width="4"/>
    <path d="M85 92H141M113 64V120" stroke="#0f8f9c" stroke-width="9" stroke-linecap="round"/>
    <text x="198" y="58" font-family="Verdana, sans-serif" font-size="23" font-weight="700" fill="#12263a">Native RAG</text>
    <text x="198" y="91" font-family="Verdana, sans-serif" font-size="16" fill="#5d7184">Retrieval, citations, graph</text>
    <text x="198" y="116" font-family="Verdana, sans-serif" font-size="16" fill="#5d7184">context, and CRAG lanes.</text>
  </g>

  <g transform="translate(934 218)" filter="url(#softShadow)">
    <rect width="352" height="178" rx="28" fill="#ffffff" opacity="0.9"/>
    <path d="M61 122L91 54L122 101L149 77L178 122Z" fill="#fff0df" stroke="#ff7a1a" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="92" cy="80" r="10" fill="#ff7a1a"/>
    <text x="198" y="58" font-family="Verdana, sans-serif" font-size="23" font-weight="700" fill="#12263a">Pointy Bridge</text>
    <text x="198" y="91" font-family="Verdana, sans-serif" font-size="16" fill="#5d7184">Realtime cursor, spotlight,</text>
    <text x="198" y="116" font-family="Verdana, sans-serif" font-size="16" fill="#5d7184">safe host actions, LMS UI.</text>
  </g>

  <g transform="translate(104 445)">
    <rect width="1192" height="50" rx="25" fill="url(#ocean)" opacity="0.95"/>
    <text x="36" y="32" font-family="Verdana, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Production lane:</text>
    <text x="186" y="32" font-family="Verdana, sans-serif" font-size="17" fill="#ffffff">CI/CD gates, immutable GHCR images, NVIDIA provider runtime, deploy smoke, and rollback-first operations.</text>
  </g>
</svg>
