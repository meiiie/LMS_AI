[package]
name = "wiii-desktop"
version = "1.2.0"
description = "Wiii — durable AI workbench by The Wiii Lab"
authors = ["Meiiie (The Wiii Lab)"]
edition = "2021"
license = "AGPL-3.0-only"
homepage = "https://wiii.holilihu.online"
repository = "https://github.com/meiiie/wiii"

[lib]
name = "wiii_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["net"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.25.0", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
sha2 = "0.10.9"
