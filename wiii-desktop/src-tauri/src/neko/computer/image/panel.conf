Global {
  edge=bottom
  align=left
  margin=0
  widthtype=percent
  width=100
  height=34
  transparent=0
  tintcolor=#f5f2eb
  alpha=255
  autohide=0
  heightwhenhidden=2
  setdocktype=1
  setpartialstrut=1
  usefontcolor=1
  fontcolor=#242321
  usefontsize=1
  fontsize=10
  background=1
  backgroundfile=/usr/share/wiii-computer/wallpaper.svg
}

Plugin {
  type=menu
  Config {
    name=Wiii
    image=computer
    system {
    }
    separator {
    }
    item {
      image=system-shutdown
      command=logout
    }
  }
}

Plugin {
  type=launchbar
  Config {
    Button { id=google-chrome.desktop }
    Button { id=pcmanfm.desktop }
    Button { id=lxterminal.desktop }
  }
}

Plugin {
  type=taskbar
  expand=1
  Config {
    tooltips=1
    IconsOnly=0
    ShowAllDesks=1
    UseMouseWheel=1
    MaxTaskWidth=180
  }
}

Plugin {
  type=dclock
  Config {
    ClockFmt=%H:%M
    TooltipFmt=%A %d/%m/%Y
    BoldFont=0
  }
}
