<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Wiii Computer</title>
    <style>
      html, body, #screen { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111; }
      #screen { display: grid; place-items: center; }
      #screen canvas { max-width: 100%; max-height: 100%; image-rendering: auto; }
      #status { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; padding: 24px; color: #d8d8d8; font: 14px/1.5 system-ui; text-align: center; }
      #status[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="status" role="status" aria-live="polite">Connecting to Wiii Computer…</div>
    <div id="screen"></div>
    <script type="module">
      import RFB from './core/rfb.js';

      const fragment = new URLSearchParams(location.hash.slice(1));
      const query = new URLSearchParams(location.search);
      const password = fragment.get('password') || '';
      const viewOnly = query.get('view_only') !== '0';
      history.replaceState(null, '', `${location.pathname}${location.search}`);
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      const target = `${scheme}://${location.host}/websockify`;
      const screen = document.getElementById('screen');
      const status = document.getElementById('status');
      const report = (phase, detail = {}) => {
        parent.postMessage({
          source: 'wiii-computer-viewer-v1',
          phase,
          at: Date.now(),
          ...detail,
        }, '*');
      };
      report('viewer.loaded');
      const rfb = new RFB(screen, target, { credentials: { password } });
      rfb.viewOnly = viewOnly;
      const connectionDeadline = window.setTimeout(() => {
        status.hidden = false;
        status.textContent = 'Wiii Computer đang mất nhiều thời gian hơn dự kiến để kết nối.';
        report('rfb.timeout');
      }, 12000);
      let framebufferTimer = 0;
      let framebufferDeadline = 0;
      const stopFramebufferProbe = () => {
        if (framebufferTimer) window.clearInterval(framebufferTimer);
        framebufferTimer = 0;
      };
      const framebufferHasVisiblePixels = () => {
        const canvas = screen.querySelector('canvas');
        if (!canvas || canvas.width === 0 || canvas.height === 0) return false;
        const probe = document.createElement('canvas');
        probe.width = 48;
        probe.height = 30;
        const context = probe.getContext('2d', { willReadFrequently: true });
        if (!context) return false;
        context.drawImage(canvas, 0, 0, probe.width, probe.height);
        const pixels = context.getImageData(0, 0, probe.width, probe.height).data;
        let visible = 0;
        for (let index = 0; index < pixels.length; index += 4) {
          if (pixels[index] + pixels[index + 1] + pixels[index + 2] > 24) visible += 1;
          if (visible >= 3) return true;
        }
        return false;
      };
      const startFramebufferProbe = () => {
        stopFramebufferProbe();
        framebufferDeadline = Date.now() + 10000;
        framebufferTimer = window.setInterval(() => {
          try {
            if (framebufferHasVisiblePixels()) {
              stopFramebufferProbe();
              status.hidden = true;
              report('framebuffer.visible');
              return;
            }
          } catch (error) {
            stopFramebufferProbe();
            status.hidden = false;
            status.textContent = 'Wiii không thể kiểm tra hình ảnh từ Computer.';
            report('framebuffer.failed', { reason: String(error) });
            return;
          }
          if (Date.now() >= framebufferDeadline) {
            stopFramebufferProbe();
            status.hidden = false;
            status.textContent = 'Computer đã kết nối nhưng chưa gửi được hình ảnh. Hãy kết nối lại.';
            report('framebuffer.timeout');
          }
        }, 250);
      };
      rfb.scaleViewport = true;
      rfb.clipViewport = false;
      rfb.resizeSession = false;
      rfb.background = '#111111';
      rfb.addEventListener('connect', () => {
        window.clearTimeout(connectionDeadline);
        status.hidden = false;
        status.textContent = 'Đã kết nối · đang nhận hình ảnh từ Computer…';
        report('rfb.connected');
        startFramebufferProbe();
      });
      rfb.addEventListener('disconnect', (event) => {
        window.clearTimeout(connectionDeadline);
        stopFramebufferProbe();
        status.hidden = false;
        status.textContent = event.detail.clean ? 'Computer đã ngắt kết nối.' : 'Kết nối tới Computer đã bị gián đoạn.';
        report('rfb.disconnected', { clean: event.detail.clean === true });
      });
      rfb.addEventListener('securityfailure', () => {
        window.clearTimeout(connectionDeadline);
        stopFramebufferProbe();
        status.hidden = false;
        status.textContent = 'Wiii Computer không thể xác thực màn hình.';
        report('rfb.security_failure');
      });
      rfb.addEventListener('credentialsrequired', () => rfb.sendCredentials({ password }));
    </script>
  </body>
</html>
